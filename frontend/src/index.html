<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Gestion Commandes & Livraisons</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    nav { background: #1976d2; padding: 12px 24px; display: flex; gap: 20px; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    nav a.active { border-bottom: 2px solid white; }
    .container { max-width: 1000px; margin: 24px auto; background: white; padding: 24px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #f0f0f0; }
    .btn-primary { background: #1976d2; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    .badge { background: #e3f2fd; color: #1976d2; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .item-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .item-row input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .actions { margin-top: 16px; display: flex; gap: 12px; }
    .track-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .track-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
    .tracked-result { background: #e8f5e9; padding: 12px; border-radius: 4px; margin-bottom: 16px; }
    .delivery-info { background: #e3f2fd; padding: 16px; border-radius: 4px; margin-top: 16px; }
    select { padding: 4px; border-radius: 4px; }
    button { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; }
    a { color: #1976d2; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
