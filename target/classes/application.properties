# ==========================================
# Datasource H2 (base en mémoire, aucune installation requise)
# ==========================================
spring.datasource.url=jdbc:h2:mem:gestion_commandes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ==========================================
# Serveur
# ==========================================
server.port=8080

# ==========================================
# CORS - Frontend Angular
# ==========================================
spring.web.cors.allowed-origins=http://localhost:4200
